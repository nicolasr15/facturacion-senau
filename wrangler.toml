name = "facturacion-senau"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# nodejs_compat: @dian-kit/core usa node:crypto (webcrypto para XAdES) y node:buffer.
# Ver Fase 0 del README.
compatibility_flags = ["nodejs_compat"]

# Sin rutas públicas a propósito: solo se llama por service binding desde senau-tickets.
workers_dev = false

[vars]
# "2" = ambiente de pruebas/habilitación de la DIAN, "1" = producción.
DIAN_ENV = "2"
# Emisor (Senau SAS). El DV y el tipo de identificación (31 = NIT) los usa el XML.
SUPPLIER_NAME = "SENAU SAS"
SUPPLIER_NIT = "902105968"
SUPPLIER_DV = "8"
SUPPLIER_EMAIL = "camara@senau.music"
SUPPLIER_ADDRESS = "CL 10 SUR 43 A 54 AP 415"
SUPPLIER_CITY_CODE = "05001"       # Medellín (DANE)
SUPPLIER_CITY_NAME = "Medellín"
SUPPLIER_DEPT_CODE = "05"          # Antioquia
SUPPLIER_DEPT_NAME = "Antioquia"
# Ciudad/departamento por defecto del comprador: senau-tickets no los captura
# (solo cédula, correo y nombre). La calle del comprador va fija en "No
# informada" (confirmado con el contador, ver config.ts) — no es configurable
# aquí. Si se omiten estas variables se usa la ciudad/departamento del emisor.
# DEFAULT_BUYER_CITY_CODE = "05001"
# DEFAULT_BUYER_CITY_NAME = "Medellín"
# DEFAULT_BUYER_DEPT_CODE = "05"
# DEFAULT_BUYER_DEPT_NAME = "Antioquia"
# Método de pago DIAN por defecto si senau-tickets no lo manda (48 tarjeta crédito, 49 débito, 47 PSE, ZZZ otro).
DEFAULT_PAYMENT_METHOD = "ZZZ"
# Tipo de operación de la factura electrónica (tipo 01). "10" = estándar.
OPERATION_CODE = "10"
# Numeración autorizada por la DIAN (rango de habilitación/pruebas, datos reales
# tal como los dio el portal el 2026-09-18: Prefijo SETP, Nº resolución
# 18760000001, rango 990000000-995000000, vigente 19-01-2019 a 19-01-2030).
# La "Fecha resolución" (01-01-0001) que muestra el portal no se usa aquí: no hay
# ningún campo de DianDocument/generateCufe que la pida, solo el rango de
# vigencia (from/to) y el número de autorización.
DIAN_NUMBERING_PREFIX = "SETP"
DIAN_NUMBERING_START = "990000000"
DIAN_NUMBERING_END = "995000000"
DIAN_NUMBERING_FROM = "2019-01-19"
DIAN_NUMBERING_TO = "2030-01-19"
DIAN_NUMBERING_AUTH = "18760000001"
# Numeración propia para notas crédito/débito (opcional). Si se deja sin definir,
# se reutiliza la numeración de la factura de arriba (mismo criterio que el
# ejemplo oficial de dian-kit) — SIN CONFIRMAR si la DIAN exige o no una
# numeración autorizada aparte para notas (fuentes públicas contradictorias,
# ver "CONTADOR" en src/lib/notas.ts). Si hace falta un prefijo propio,
# descomentar y llenar con los datos reales del portal:
# DIAN_NOTES_NUMBERING_PREFIX = "..."
# DIAN_NOTES_NUMBERING_START = "..."
# DIAN_NOTES_NUMBERING_END = "..."
# DIAN_NOTES_NUMBERING_FROM = "YYYY-MM-DD"
# DIAN_NOTES_NUMBERING_TO = "YYYY-MM-DD"
# DIAN_NOTES_NUMBERING_AUTH = "..."
# Reintentos para documentos en estado failed
MAX_ATTEMPTS = "5"
# Minutos tras los cuales un `sending` sin respuesta se concilia con GetStatus (cron)
STALE_SENDING_MINUTES = "30"

# Secrets (npm run secrets): SIGNING_KEY_PEM, SIGNING_CERT_PEM,
# DIAN_SOFTWARE_ID, DIAN_SOFTWARE_PIN, DIAN_NUMBERING_TECHNICAL_KEY, INTERNAL_KEY

[[d1_databases]]
binding = "DB"
database_name = "facturacion-senau"
database_id = "bca1fce5-0545-4e17-8d1b-79afbdd0cf4b"

# Cola: la API interna encola; el consumidor firma y transmite con reintentos.
[[queues.producers]]
binding = "EMISION"
queue = "facturacion-senau-emision"

[[queues.consumers]]
queue = "facturacion-senau-emision"
max_batch_size = 5
max_retries = 5
dead_letter_queue = "facturacion-senau-dlq"

# Cron: cada 15 min reintenta los `failed` con intentos disponibles y consulta estado de los `sending`.
[triggers]
crons = ["*/15 * * * *"]
